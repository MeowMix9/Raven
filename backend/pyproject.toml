[project]
name = "raven"
version = "0.1.0"
description = "Configurable quote and business automation engine"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.139,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.41,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
